<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nocturne</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<style>
  :root{
    --bg:#000000;
    --card:#151517;
    --card-2:#1C1C1F;
    --stroke:rgba(255,255,255,0.08);
    --text:#FFFFFF;
    --text-dim:rgba(255,255,255,0.5);
    --text-faint:rgba(255,255,255,0.28);
    --accent:#FB4A5C;
    --accent-2:#FA233B;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{ position:fixed; inset:0; overflow:hidden; }
  .view{
    position:absolute; inset:0;
    overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 20px) 18px 170px;
    display:none;
  }
  .view.active{ display:block; }

  .page-title{ font-size:32px; font-weight:800; letter-spacing:-0.02em; margin-bottom:18px; }
  .section-label{ font-size:19px; font-weight:700; margin:22px 0 12px; }

  /* ---- Empty states ---- */
  .empty{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:60px 20px; color:var(--text-dim);
  }
  .empty svg{ width:48px; height:48px; margin-bottom:16px; color:var(--text-faint); }
  .empty h3{ color:var(--text); font-size:17px; font-weight:700; margin-bottom:6px; }
  .empty p{ font-size:14px; margin-bottom:20px; max-width:260px; }

  .btn{
    background:var(--text); color:#000;
    border:none; border-radius:999px;
    padding:13px 22px; font-size:15px; font-weight:700;
    cursor:pointer;
  }
  .btn.ghost{
    background:var(--card-2); color:var(--text);
    border:1px solid var(--stroke);
  }
  .btn-row{ display:flex; gap:10px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .icon-btn{
    background:none; border:none; color:var(--text); width:26px; height:26px; cursor:pointer;
  }
  .icon-btn svg{ width:100%; height:100%; }

  /* ---- Horizontal scroll cards ---- */
  .hscroll{ display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
  .hscroll::-webkit-scrollbar{ display:none; }
  .rec-card{ flex:0 0 auto; width:150px; cursor:pointer; }
  .rec-art{ width:150px; height:150px; border-radius:14px; margin-bottom:8px; box-shadow:0 8px 20px rgba(0,0,0,0.4); }
  .rec-card .tt{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rec-card .ta{ font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---- Track rows ---- */
  .track-row{
    display:flex; align-items:center; gap:12px;
    padding:9px 6px; border-radius:14px; cursor:pointer;
  }
  .track-row:active{ background:var(--card); }
  .track-row.playing .tt{ color:var(--accent); }
  .t-swatch{ width:46px; height:46px; border-radius:10px; flex-shrink:0; }
  .t-info{ flex:1; min-width:0; }
  .t-info .tt{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t-info .ta{ font-size:12.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t-dur{ font-size:12px; color:var(--text-faint); flex-shrink:0; }
  .eq{ display:flex; align-items:flex-end; gap:2px; width:14px; height:14px; flex-shrink:0; }
  .eq span{ width:3px; background:var(--accent); border-radius:2px; animation:eq 1s ease-in-out infinite; }
  .eq span:nth-child(1){ height:40%; } .eq span:nth-child(2){ height:100%; animation-delay:.2s; } .eq span:nth-child(3){ height:65%; animation-delay:.4s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(0.4);} 50%{ transform:scaleY(1);} }

  /* ---- Search ---- */
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border-radius:12px; padding:10px 12px; margin-bottom:18px;
  }
  .search-box svg{ width:18px; height:18px; color:var(--text-dim); flex-shrink:0; }
  .search-box input{
    background:none; border:none; outline:none; color:var(--text);
    font-size:16px; width:100%; font-family:inherit;
  }
  .search-box input::placeholder{ color:var(--text-faint); }

  /* ---- Mini player ---- */
  .mini-player{
    position:fixed; left:10px; right:10px;
    bottom:calc(env(safe-area-inset-bottom) + 78px);
    background:rgba(28,28,31,0.92);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--stroke);
    border-radius:16px;
    display:flex; align-items:center; gap:12px;
    padding:8px 10px;
    z-index:20;
    transition:transform .25s ease, opacity .25s ease;
  }
  .mini-player.hidden{ transform:translateY(20px); opacity:0; pointer-events:none; }
  .mini-art{ width:40px; height:40px; border-radius:8px; flex-shrink:0; }
  .mini-info{ flex:1; min-width:0; }
  .mini-title{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-artist{ font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-btn{ background:none; border:none; color:var(--text); width:26px; height:26px; flex-shrink:0; }
  .mini-btn svg{ width:100%; height:100%; }

  /* ---- Tab bar with liquid glass lens ---- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0;
    padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
    background:rgba(10,10,11,0.85);
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border-top:1px solid var(--stroke);
    display:flex; justify-content:space-around;
    z-index:30;
    overflow:visible;
    touch-action:none;
  }
  .nav-indicator{
    position:absolute; left:0; top:-14px; height:80px; width:70px;
    border-radius:999px;
    background:
      radial-gradient(90px 70px at var(--hx,50%) var(--hy,22%), rgba(255,255,255,0.4), transparent 62%),
      rgba(255,255,255,0.05);
    backdrop-filter:blur(10px) saturate(220%) brightness(1.25) contrast(1.1);
    -webkit-backdrop-filter:blur(10px) saturate(220%) brightness(1.25) contrast(1.1);
    border:1px solid rgba(255,255,255,0.16);
    box-shadow:
      inset 0 1.5px 1px rgba(255,255,255,0.4),
      inset 0 -8px 14px rgba(0,0,0,0.3),
      inset 6px 0 10px -6px rgba(255,255,255,0.25),
      inset -6px 0 10px -6px rgba(255,255,255,0.25),
      0 12px 28px rgba(0,0,0,0.5);
    transition:left .5s cubic-bezier(.22,1.6,.36,1), width .35s cubic-bezier(.22,1.6,.36,1), transform .3s cubic-bezier(.22,1.6,.36,1), backdrop-filter .3s ease;
    pointer-events:none;
    z-index:2;
  }
  .nav-indicator::before, .nav-indicator::after{
    content:'';
    position:absolute; left:14%; right:14%; height:2px;
    border-radius:999px;
    background:linear-gradient(90deg,#ff6b6b,#ffd166,#4fd8a4,#4facfe,#c084fc);
    filter:blur(1.4px);
    opacity:0.15;
    mix-blend-mode:screen;
    transition:opacity .3s ease, height .3s ease, filter .3s ease;
  }
  .nav-indicator::before{ top:4px; }
  .nav-indicator::after{ bottom:4px; }
  .nav-indicator.dragging{
    transition:width .12s ease, backdrop-filter .12s ease;
    backdrop-filter:blur(9px) saturate(260%) brightness(1.4) contrast(1.18);
    -webkit-backdrop-filter:blur(9px) saturate(260%) brightness(1.4) contrast(1.18);
  }
  .nav-indicator.dragging::before, .nav-indicator.dragging::after{
    opacity:1;
    height:3px;
    filter:blur(2.2px) saturate(1.7);
  }
  .tab{
    position:relative; z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    padding:8px 16px; flex:1;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .tab svg{ width:23px; height:23px; }
  .tab span{ font-size:10.5px; font-weight:600; }
  .tab.active{ color:var(--accent); }

  /* ---- Now Playing sheet ---- */
  .sheet{
    position:fixed; inset:0; z-index:40;
    background:linear-gradient(180deg, #1a1214, #050506 55%);
    transform:translateY(100%);
    transition:transform .4s cubic-bezier(.32,.9,.44,1);
    display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 20px);
  }
  .sheet.open{ transform:translateY(0); }
  .sheet.dragging{ transition:none; }
  .drag-handle{ width:36px; height:5px; border-radius:999px; background:rgba(255,255,255,0.25); margin:0 auto 18px; }
  .sheet-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; }
  .sheet-top .lbl{ font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; }
  .np-art{
    width:100%; aspect-ratio:1/1; border-radius:16px; margin-bottom:26px;
    box-shadow:0 20px 50px rgba(0,0,0,0.55);
  }
  .np-meta{ margin-bottom:22px; }
  .np-meta .tt{ font-size:22px; font-weight:800; letter-spacing:-0.01em; margin-bottom:4px; }
  .np-meta .ta{ font-size:15px; color:var(--text-dim); }
  .np-scrub{ margin-bottom:14px; }
  .scrub-track{ position:relative; height:16px; display:flex; align-items:center; cursor:pointer; }
  .scrub-bg{ position:absolute; left:0; right:0; height:4px; border-radius:999px; background:rgba(255,255,255,0.16); }
  .scrub-fill{ position:absolute; left:0; height:4px; border-radius:999px; background:linear-gradient(90deg,var(--accent-2),var(--accent)); width:0%; }
  .scrub-knob{ position:absolute; left:0%; width:12px; height:12px; border-radius:50%; background:#fff; transform:translateX(-50%); }
  .time-row{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-faint); margin-bottom:24px; font-variant-numeric:tabular-nums; }
  .np-controls{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .np-btn{ background:none; border:none; color:var(--text); cursor:pointer; }
  .np-btn svg{ width:22px; height:22px; }
  .np-btn.small svg{ width:19px; height:19px; }
  .np-btn.play{ width:64px; height:64px; display:flex; align-items:center; justify-content:center; }
  .np-btn.play svg{ width:38px; height:38px; }
  .np-btn.active{ color:var(--accent); }
  .vol-row{ display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .vol-row svg{ width:16px; height:16px; color:var(--text-faint); flex-shrink:0; }
  .vol-track{ position:relative; flex:1; height:14px; display:flex; align-items:center; cursor:pointer; }
  .vol-bg{ position:absolute; left:0; right:0; height:4px; border-radius:999px; background:rgba(255,255,255,0.16); }
  .vol-fill{ position:absolute; left:0; height:4px; border-radius:999px; background:rgba(255,255,255,0.7); width:70%; }
  .np-foot{ display:flex; justify-content:space-between; align-items:center; }
  .foot-btn{ display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; }
  .foot-btn svg{ width:17px; height:17px; }

  .queue-panel{
    position:fixed; inset:0; z-index:50;
    background:rgba(8,8,9,0.98);
    transform:translateY(100%);
    transition:transform .35s ease;
    padding:calc(env(safe-area-inset-top) + 16px) 20px 20px;
    overflow-y:auto;
  }
  .queue-panel.open{ transform:translateY(0); }
  .queue-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .queue-head h2{ font-size:18px; font-weight:800; }

  input[type=file]{ display:none; }

  @media (prefers-reduced-motion: reduce){
    .eq span{ animation:none !important; }
    .nav-indicator, .tab svg, .sheet{ transition:none !important; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- LISTEN NOW -->
  <div class="view active" id="view-listen">
    <div class="topbar">
      <div class="page-title" style="margin-bottom:0;">Listen Now</div>
      <button class="icon-btn" id="add-btn-1" aria-label="Add music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="listen-empty"></div>
    <div id="listen-content" style="display:none;">
      <div class="section-label">Recently Added</div>
      <div class="hscroll" id="recent-scroll"></div>
      <div class="section-label">Shuffle Mix</div>
      <div class="hscroll" id="mix-scroll"></div>
    </div>
  </div>

  <!-- LIBRARY -->
  <div class="view" id="view-library">
    <div class="topbar">
      <div class="page-title" style="margin-bottom:0;">Library</div>
      <button class="icon-btn" id="add-btn-2" aria-label="Add music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="library-empty"></div>
    <div id="library-list"></div>
  </div>

  <!-- SEARCH -->
  <div class="view" id="view-search">
    <div class="page-title">Search</div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="search-input" placeholder="Artists, songs">
    </div>
    <div id="search-results"></div>
  </div>

</div>

<!-- MINI PLAYER -->
<div class="mini-player hidden" id="mini-player">
  <div class="mini-art" id="mini-art"></div>
  <div class="mini-info">
    <div class="mini-title" id="mini-title">—</div>
    <div class="mini-artist" id="mini-artist">—</div>
  </div>
  <button class="mini-btn" id="mini-play" aria-label="Play">
    <svg id="mini-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button class="mini-btn" id="mini-next" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
  </button>
</div>

<!-- TAB BAR -->
<nav class="tabbar" id="tabbar">
  <div class="nav-indicator" id="nav-indicator"></div>
  <button class="tab active" data-view="listen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span>Listen Now</span>
  </button>
  <button class="tab" data-view="library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16l4-2 4 2 4-2 4 2V4"/></svg>
    <span>Library</span>
  </button>
  <button class="tab" data-view="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <span>Search</span>
  </button>
</nav>

<!-- NOW PLAYING SHEET -->
<div class="sheet" id="sheet">
  <div class="drag-handle" id="drag-handle"></div>
  <div class="sheet-top">
    <span class="lbl">Playing from Library</span>
    <button class="icon-btn" id="sheet-close" style="width:22px;height:22px;" aria-label="Minimize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="np-art" id="np-art"></div>
  <div class="np-meta">
    <div class="tt" id="np-title">—</div>
    <div class="ta" id="np-artist">—</div>
  </div>
  <div class="np-scrub">
    <div class="scrub-track" id="scrub-track">
      <div class="scrub-bg"></div>
      <div class="scrub-fill" id="scrub-fill"></div>
      <div class="scrub-knob" id="scrub-knob"></div>
    </div>
    <div class="time-row"><span id="np-current">0:00</span><span id="np-total">0:00</span></div>
  </div>
  <div class="np-controls">
    <button class="np-btn small" id="shuffle-btn" aria-label="Shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4l10 16h4M4 20h4l3.5-5.5M17 4h4v4M17 20h4v-4M14.5 9.5L18 4"/></svg>
    </button>
    <button class="np-btn" id="np-prev" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
    </button>
    <button class="np-btn play" id="np-play" aria-label="Play">
      <svg id="np-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="np-btn" id="np-next" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
    </button>
    <button class="np-btn small" id="repeat-btn" aria-label="Repeat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>
  <div class="vol-row">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/></svg>
    <div class="vol-track" id="vol-track"><div class="vol-bg"></div><div class="vol-fill" id="vol-fill"></div></div>
  </div>
  <div class="np-foot">
    <button class="foot-btn" id="lyrics-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
      Lyrics
    </button>
    <button class="foot-btn" id="queue-btn">
      Up Next
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>
  </div>
</div>

<!-- QUEUE PANEL -->
<div class="queue-panel" id="queue-panel">
  <div class="queue-head">
    <h2>Up Next</h2>
    <button class="icon-btn" id="queue-close" style="width:22px;height:22px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="queue-list"></div>
</div>

<input type="file" id="file-input" accept="audio/*" multiple>
<audio id="audio"></audio>

<script>
(function(){
  "use strict";

  /* ---------------- IndexedDB ---------------- */
  const DB_NAME = 'nocturne-db', STORE = 'tracks';
  let db = null;
  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        if(!d.objectStoreNames.contains(STORE)){
          d.createObjectStore(STORE, { keyPath:'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function idbAdd(track){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(track);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  function idbAll(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  /* ---------------- State ---------------- */
  let library = [];      // {id, title, artist, blob, duration, addedAt, hue}
  let queue = [];        // array of ids, current play order
  let queuePos = 0;
  let shuffle = false;
  let repeatMode = 0;    // 0 off, 1 all, 2 one
  let isPlaying = false;
  let currentObjectUrl = null;

  const audio = document.getElementById('audio');

  /* ---------------- Helpers ---------------- */
  function fmt(s){
    if(!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60), sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }
  function hashHue(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
    return h % 360;
  }
  function swatch(track){
    const hue = track.hue;
    return `linear-gradient(135deg, hsl(${hue},70%,55%), hsl(${(hue+50)%360},65%,42%))`;
  }
  function parseName(filename){
    const base = filename.replace(/\.[^/.]+$/, '');
    if(base.includes(' - ')){
      const [a, ...rest] = base.split(' - ');
      return { artist:a.trim(), title:rest.join(' - ').trim() };
    }
    return { artist:'Unknown Artist', title:base };
  }
  function trackById(id){ return library.find(t => t.id === id); }

  /* ---------------- Library management ---------------- */
  async function addFiles(fileList){
    const files = Array.from(fileList);
    for(const file of files){
      const { artist, title } = parseName(file.name);
      const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      const track = {
        id, title, artist, blob:file,
        duration:0, addedAt:Date.now(),
        hue: hashHue(file.name)
      };
      await idbAdd(track);
      library.unshift(track);
    }
    renderAll();
  }

  async function loadLibrary(){
    db = await openDB();
    library = (await idbAll()).sort((a,b) => b.addedAt - a.addedAt);
    renderAll();
  }

  /* ---------------- Rendering ---------------- */
  function renderAll(){
    renderListen();
    renderLibrary();
    renderSearch();
  }

  function emptyBlock(msg, sub){
    return `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <h3>${msg}</h3>
      <p>${sub}</p>
      <button class="btn add-trigger">Add Music</button>
    </div>`;
  }

  function renderListen(){
    const emptyEl = document.getElementById('listen-empty');
    const contentEl = document.getElementById('listen-content');
    if(library.length === 0){
      emptyEl.innerHTML = emptyBlock('No music yet', 'Add songs from your device to start listening.');
      emptyEl.style.display = 'block';
      contentEl.style.display = 'none';
      return;
    }
    emptyEl.style.display = 'none';
    contentEl.style.display = 'block';
    const recent = library.slice(0, 10);
    document.getElementById('recent-scroll').innerHTML = recent.map(cardHtml).join('');
    const mix = [...library].sort(() => Math.random() - 0.5).slice(0, 10);
    document.getElementById('mix-scroll').innerHTML = mix.map(cardHtml).join('');
    bindCardClicks();
  }
  function cardHtml(t){
    return `<div class="rec-card" data-id="${t.id}">
      <div class="rec-art" style="background:${swatch(t)}"></div>
      <div class="tt">${escapeHtml(t.title)}</div>
      <div class="ta">${escapeHtml(t.artist)}</div>
    </div>`;
  }
  function bindCardClicks(){
    document.querySelectorAll('.rec-card').forEach(el => {
      el.onclick = () => playFromLibrary(el.dataset.id);
    });
  }

  function renderLibrary(){
    const emptyEl = document.getElementById('library-empty');
    const listEl = document.getElementById('library-list');
    if(library.length === 0){
      emptyEl.innerHTML = emptyBlock('Your library is empty', 'Add local audio files to build your library.');
      emptyEl.style.display = 'block';
      listEl.innerHTML = '';
      return;
    }
    emptyEl.style.display = 'none';
    listEl.innerHTML = library.map(trackRowHtml).join('');
    bindRowClicks(listEl);
  }

  function trackRowHtml(t){
    const isCurrent = queue[queuePos] === t.id;
    return `<div class="track-row${isCurrent ? ' playing' : ''}" data-id="${t.id}">
      <div class="t-swatch" style="background:${swatch(t)}"></div>
      <div class="t-info">
        <div class="tt">${escapeHtml(t.title)}</div>
        <div class="ta">${escapeHtml(t.artist)}</div>
      </div>
      ${isCurrent && isPlaying ? '<div class="eq"><span></span><span></span><span></span></div>' : (t.duration ? `<div class="t-dur">${fmt(t.duration)}</div>` : '')}
    </div>`;
  }
  function bindRowClicks(container){
    container.querySelectorAll('.track-row').forEach(el => {
      el.onclick = () => playFromLibrary(el.dataset.id);
    });
  }

  function renderSearch(){
    const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
    const results = document.getElementById('search-results');
    if(!q){ results.innerHTML = ''; return; }
    const matches = library.filter(t =>
      t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
    );
    results.innerHTML = matches.length
      ? matches.map(trackRowHtml).join('')
      : `<p style="color:var(--text-dim); padding:20px 6px;">No results for "${escapeHtml(q)}"</p>`;
    bindRowClicks(results);
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------------- Playback ---------------- */
  function buildQueueFrom(id){
    const ids = library.map(t => t.id);
    if(shuffle){
      const rest = ids.filter(x => x !== id).sort(() => Math.random() - 0.5);
      queue = [id, ...rest];
    } else {
      queue = ids;
    }
    queuePos = queue.indexOf(id);
  }

  function playFromLibrary(id){
    buildQueueFrom(id);
    playCurrent();
  }

  function playCurrent(){
    const id = queue[queuePos];
    const track = trackById(id);
    if(!track) return;
    if(currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(track.blob);
    audio.src = currentObjectUrl;
    audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
    updateNowPlayingUI(track);
    showMiniPlayer();
    renderLibrary();
  }

  function setPlaying(state){
    isPlaying = state;
    const d = state ? "M6 5h4v14H6zM14 5h4v14h-4z" : "M8 5v14l11-7z";
    document.getElementById('mini-play-icon').setAttribute('d', d);
    document.getElementById('np-play-icon').setAttribute('d', d);
    renderLibrary();
  }

  function updateNowPlayingUI(track){
    document.getElementById('mini-title').textContent = track.title;
    document.getElementById('mini-artist').textContent = track.artist;
    document.getElementById('mini-art').style.background = swatch(track);
    document.getElementById('np-title').textContent = track.title;
    document.getElementById('np-artist').textContent = track.artist;
    document.getElementById('np-art').style.background = swatch(track);
    document.getElementById('lyrics-body') && null;
  }

  function showMiniPlayer(){
    document.getElementById('mini-player').classList.remove('hidden');
  }

  function goNext(userInitiated){
    if(repeatMode === 2 && !userInitiated){
      audio.currentTime = 0; audio.play(); return;
    }
    if(queuePos < queue.length - 1){
      queuePos++;
    } else if(repeatMode === 1){
      queuePos = 0;
    } else {
      setPlaying(false);
      return;
    }
    playCurrent();
  }
  function goPrev(){
    if(audio.currentTime > 3){ audio.currentTime = 0; return; }
    queuePos = queuePos > 0 ? queuePos - 1 : queue.length - 1;
    playCurrent();
  }

  audio.addEventListener('ended', () => goNext(false));
  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('np-total').textContent = fmt(audio.duration);
    const t = trackById(queue[queuePos]);
    if(t){ t.duration = audio.duration; idbAdd(t); }
  });
  let scrubbing = false;
  audio.addEventListener('timeupdate', () => {
    if(scrubbing) return;
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    document.getElementById('scrub-fill').style.width = pct + '%';
    document.getElementById('scrub-knob').style.left = pct + '%';
    document.getElementById('np-current').textContent = fmt(audio.currentTime);
  });

  document.getElementById('mini-play').onclick = () => {
    if(isPlaying){ audio.pause(); setPlaying(false); }
    else audio.play().then(() => setPlaying(true)).catch(()=>{});
  };
  document.getElementById('mini-next').onclick = () => goNext(true);
  document.getElementById('np-play').onclick = () => {
    if(isPlaying){ audio.pause(); setPlaying(false); }
    else audio.play().then(() => setPlaying(true)).catch(()=>{});
  };
  document.getElementById('np-next').onclick = () => goNext(true);
  document.getElementById('np-prev').onclick = () => goPrev();

  document.getElementById('shuffle-btn').onclick = function(){
    shuffle = !shuffle;
    this.classList.toggle('active', shuffle);
    if(queue.length){ buildQueueFrom(queue[queuePos]); }
  };
  document.getElementById('repeat-btn').onclick = function(){
    repeatMode = (repeatMode + 1) % 3;
    this.classList.toggle('active', repeatMode !== 0);
    const svg = this.querySelector('svg');
    svg.style.opacity = repeatMode === 2 ? '0.7' : '1';
  };

  /* Scrub bar */
  const scrubTrack = document.getElementById('scrub-track');
  function seekFromEvent(e){
    const rect = scrubTrack.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    document.getElementById('scrub-fill').style.width = (pct*100)+'%';
    document.getElementById('scrub-knob').style.left = (pct*100)+'%';
    if(audio.duration){
      audio.currentTime = pct * audio.duration;
      document.getElementById('np-current').textContent = fmt(audio.currentTime);
    }
  }
  scrubTrack.addEventListener('mousedown', e => { scrubbing = true; seekFromEvent(e); });
  window.addEventListener('mousemove', e => { if(scrubbing) seekFromEvent(e); });
  window.addEventListener('mouseup', () => scrubbing = false);
  scrubTrack.addEventListener('touchstart', e => { scrubbing = true; seekFromEvent(e); });
  window.addEventListener('touchmove', e => { if(scrubbing) seekFromEvent(e); });
  window.addEventListener('touchend', () => scrubbing = false);

  /* Volume */
  const volTrack = document.getElementById('vol-track');
  audio.volume = 0.8;
  let volSeeking = false;
  function setVol(e){
    const rect = volTrack.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    audio.volume = pct;
    document.getElementById('vol-fill').style.width = (pct*100)+'%';
  }
  document.getElementById('vol-fill').style.width = '80%';
  volTrack.addEventListener('mousedown', e => { volSeeking = true; setVol(e); });
  window.addEventListener('mousemove', e => { if(volSeeking) setVol(e); });
  window.addEventListener('mouseup', () => volSeeking = false);

  /* ---------------- Tabs + liquid glass lens ---------------- */
  const tabbar = document.getElementById('tabbar');
  const indicator = document.getElementById('nav-indicator');
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const MAG_RADIUS = 90;   // px either side of pointer that feels the lens
  const MAG_SCALE = 0.32;  // extra scale at dead-center
  const MAX_STRETCH = 0.34;
  const VEL_SENSITIVITY = 0.045;
  let lastMoveX = 0, lastMoveTime = 0;

  function showView(name){
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
  }

  function moveIndicator(btn, animate){
    const barRect = tabbar.getBoundingClientRect();
    const r = btn.getBoundingClientRect();
    const left = r.left - barRect.left;
    if(!animate) indicator.style.transition = 'none';
    indicator.style.left = left + 'px';
    indicator.style.width = r.width + 'px';
    if(!animate) requestAnimationFrame(() => { indicator.style.transition = ''; });
  }

  function restEmphasis(){
    tabs.forEach(t => { t.style.transform = t.classList.contains('active') ? 'scale(1.05)' : ''; });
  }

  function selectTab(btn, animate){
    tabs.forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    showView(btn.dataset.view);
    moveIndicator(btn, animate);
  }

  // Continuous dock-style magnification + lens follow while dragging across the bar
  let dragging = false;
  let nearestTab = null;

  function nearestTabTo(clientX){
    let best = tabs[0], bestDist = Infinity;
    tabs.forEach(t => {
      const r = t.getBoundingClientRect();
      const c = r.left + r.width / 2;
      const d = Math.abs(clientX - c);
      if(d < bestDist){ bestDist = d; best = t; }
    });
    return best;
  }

  function applyMagnification(clientX){
    tabs.forEach(t => {
      const r = t.getBoundingClientRect();
      const c = r.left + r.width / 2;
      const d = Math.abs(clientX - c);
      const scale = d < MAG_RADIUS ? 1 + (1 - d / MAG_RADIUS) * MAG_SCALE : 1;
      t.style.transform = `scale(${scale.toFixed(3)})`;
    });
  }

  function followPointer(clientX){
    const barRect = tabbar.getBoundingClientRect();
    nearestTab = nearestTabTo(clientX);
    const nr = nearestTab.getBoundingClientRect();
    indicator.style.width = nr.width + 'px';
    const left = Math.max(0, Math.min(clientX - barRect.left - nr.width / 2, barRect.width - nr.width));
    indicator.style.left = left + 'px';
    applyMagnification(clientX);

    const now = performance.now();
    const dt = now - lastMoveTime;
    const dx = clientX - lastMoveX;
    const velocity = dt > 0 ? dx / dt : 0; // px per ms
    lastMoveTime = now; lastMoveX = clientX;

    const stretch = Math.max(-MAX_STRETCH, Math.min(MAX_STRETCH, velocity * VEL_SENSITIVITY));
    const sx = 1 + Math.abs(stretch);
    const sy = 1 - Math.abs(stretch) * 0.4;
    indicator.style.transform = `scaleX(${sx.toFixed(3)}) scaleY(${sy.toFixed(3)})`;

    const ir = indicator.getBoundingClientRect();
    const hx = ((clientX - ir.left) / ir.width) * 100;
    indicator.style.setProperty('--hx', hx.toFixed(1) + '%');
  }

  tabbar.addEventListener('pointerdown', (e) => {
    dragging = true;
    indicator.classList.add('dragging');
    indicator.style.transition = 'none';
    lastMoveX = e.clientX;
    lastMoveTime = performance.now();
    try{ tabbar.setPointerCapture(e.pointerId); }catch(err){}
    followPointer(e.clientX);
  });
  tabbar.addEventListener('pointermove', (e) => { if(dragging) followPointer(e.clientX); });
  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    indicator.classList.remove('dragging');
    indicator.style.transition = '';
    indicator.style.transform = '';
    indicator.style.setProperty('--hx', '50%');
    if(nearestTab) selectTab(nearestTab, true);
    restEmphasis();
  }
  tabbar.addEventListener('pointerup', (e) => endDrag(e));
  tabbar.addEventListener('pointercancel', (e) => endDrag(e));

  // Keyboard / assistive fallback: plain click still works without a drag gesture
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      if(dragging) return;
      selectTab(btn, true);
      restEmphasis();
    });
  });

  window.addEventListener('resize', () => {
    const active = document.querySelector('.tab.active');
    if(active) moveIndicator(active, false);
  });

  /* ---------------- Now Playing sheet open/close ---------------- */
  const sheet = document.getElementById('sheet');
  const miniPlayer = document.getElementById('mini-player');
  miniPlayer.addEventListener('click', (e) => {
    if(e.target.closest('.mini-btn')) return;
    sheet.classList.add('open');
  });
  document.getElementById('sheet-close').onclick = () => sheet.classList.remove('open');

  let dragStartY = null, dragCurrentY = 0;
  const handle = document.getElementById('drag-handle');
  function dragStart(e){
    dragStartY = (e.touches ? e.touches[0].clientY : e.clientY);
    sheet.classList.add('dragging');
  }
  function dragMove(e){
    if(dragStartY === null) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    dragCurrentY = Math.max(0, y - dragStartY);
    sheet.style.transform = `translateY(${dragCurrentY}px)`;
  }
  function dragEnd(){
    if(dragStartY === null) return;
    sheet.classList.remove('dragging');
    sheet.style.transform = '';
    if(dragCurrentY > 120) sheet.classList.remove('open');
    dragStartY = null; dragCurrentY = 0;
  }
  handle.addEventListener('mousedown', dragStart);
  handle.addEventListener('touchstart', dragStart);
  window.addEventListener('mousemove', dragMove);
  window.addEventListener('touchmove', dragMove);
  window.addEventListener('mouseup', dragEnd);
  window.addEventListener('touchend', dragEnd);

  /* ---------------- Queue panel ---------------- */
  const queuePanel = document.getElementById('queue-panel');
  document.getElementById('queue-btn').onclick = () => {
    renderQueuePanel();
    queuePanel.classList.add('open');
  };
  document.getElementById('queue-close').onclick = () => queuePanel.classList.remove('open');
  function renderQueuePanel(){
    const upcoming = queue.slice(queuePos + 1).map(trackById).filter(Boolean);
    const list = document.getElementById('queue-list');
    if(upcoming.length === 0){
      list.innerHTML = `<p style="color:var(--text-dim);">Nothing queued next.</p>`;
      return;
    }
    list.innerHTML = upcoming.map(trackRowHtml).join('');
    bindRowClicks(list);
  }

  document.getElementById('lyrics-btn').onclick = () => {
    alert('Lyrics aren\'t available for local files — Nocturne only knows the title and artist parsed from the filename.');
  };

  /* ---------------- File input ---------------- */
  const fileInput = document.getElementById('file-input');
  function openPicker(){ fileInput.click(); }
  document.getElementById('add-btn-1').onclick = openPicker;
  document.getElementById('add-btn-2').onclick = openPicker;
  document.body.addEventListener('click', (e) => {
    if(e.target.classList.contains('add-trigger')) openPicker();
  });
  fileInput.addEventListener('change', (e) => {
    if(e.target.files.length) addFiles(e.target.files);
    fileInput.value = '';
  });

  document.getElementById('search-input').addEventListener('input', renderSearch);

  /* ---------------- Init ---------------- */
  loadLibrary();
  requestAnimationFrame(() => moveIndicator(document.querySelector('.tab.active'), false));

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
